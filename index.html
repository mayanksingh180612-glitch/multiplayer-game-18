
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAYANK CARROM PRO 2.0</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:radial-gradient(circle,#30434b,#080e17);
 color:white;font-family:Arial;text-align:center;
}
header{padding:18px}
h1{color:#ffcf77;letter-spacing:3px;text-shadow:0 0 15px #e4a442}
p{color:#c7d1da}
.game{max-width:760px;margin:auto;padding:10px}
.scores{display:flex;gap:10px;justify-content:center}
.player{
 flex:1;padding:13px;background:#192a38;
 border:2px solid #79552e;border-radius:12px;
}
.player.active{border-color:#ffd36f;box-shadow:0 0 15px #ffc45b}
.score{font-size:27px;color:#ffcf77;font-weight:bold}
canvas{
 width:min(94vw,650px);height:auto;
 display:block;margin:15px auto;
 border-radius:12px;touch-action:none;
 box-shadow:0 12px 35px #000b;
}
.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
button{
 border:0;padding:12px 18px;border-radius:9px;
 background:linear-gradient(135deg,#f7d48e,#a96a25);
 font-weight:bold;cursor:pointer;
}
button:active{transform:scale(.96)}
#status{color:#ffdc99;min-height:25px}
.help{font-size:13px;line-height:1.8;color:#b9c6d1}
</style>
</head>
<body>

<header>
<h1>♛ MAYANK CARROM PRO</h1>
<p>REALISTIC CARROM • 2 PLAYER • SMOOTH GAME</p>
</header>

<div class="game">

<div class="scores">
 <div class="player active" id="box1">
 PLAYER 1
 <div class="score" id="score1">0</div>
 WHITE
 </div>
 <div class="player" id="box2">
 PLAYER 2
 <div class="score" id="score2">0</div>
 BLACK
 </div>
</div>

<canvas id="board" width="700" height="700"></canvas>

<h3 id="status">Player 1 की बारी!</h3>

<div class="controls">
<button onclick="newGame()">NEW GAME</button>
<button onclick="toggleSound()">SOUND: <span id="sound">ON</span></button>
<button onclick="showRules()">RULES</button>
</div>

<p class="help">
Striker को पीछे खींचकर छोड़ें और Coin को Pocket करें।<br>
Player 1 = White | Player 2 = Black<br>
Queen = 3 Bonus Points | First to 15 wins!
</p>

</div>

<script>
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");

const SIZE=700;
const MIN=83,MAX=617;
const pockets=[
 [83,83],[617,83],[83,617],[617,617]
];

let coins=[];
let player=1;
let score=[0,0];
let aiming=false;
let aim=null;
let moving=false;
let finished=false;
let sound=true;
let particles=[];
let message="";
let shotCoins=0;
let queenPending=false;
let foul=false;

function coin(x,y,type){
 return {
  x,y,type,
  r:type==="striker"?20:15,
  vx:0,vy:0,
  alive:true
 };
}

function resetCoins(){
 coins=[];
 coins.push(coin(350,350,"queen"));

 // Inner circle
 for(let i=0;i<6;i++){
  let a=i*Math.PI/3;
  coins.push(coin(
   350+Math.cos(a)*33,
   350+Math.sin(a)*33,
   i%2===0?"white":"black"
  ));
 }

 // Outer circle
 for(let i=0;i<12;i++){
  let a=i*Math.PI/6;
  coins.push(coin(
   350+Math.cos(a)*70,
   350+Math.sin(a)*70,
   i%2===0?"black":"white"
  ));
 }

 coins.push(coin(350,555,"striker"));
}

function striker(){
 return coins.find(c=>c.type==="striker");
}

function board(){
 // Wooden frame
 let frame=ctx.createLinearGradient(0,0,700,700);
 frame.addColorStop(0,"#e8bd79");
 frame.addColorStop(.5,"#a96b35");
 frame.addColorStop(1,"#75421f");

 ctx.fillStyle="#382014";
 ctx.fillRect(10,10,680,680);

 ctx.fillStyle=frame;
 ctx.fillRect(25,25,650,650);

 // Wooden surface
 let wood=ctx.createLinearGradient(60,60,640,640);
 wood.addColorStop(0,"#f2d4a1");
 wood.addColorStop(1,"#c18b50");

 ctx.fillStyle=wood;
 ctx.fillRect(55,55,590,590);

 // Border
 ctx.strokeStyle="#75421f";
 ctx.lineWidth=5;
 ctx.strokeRect(70,70,560,560);

 // Center
 ctx.lineWidth=2;
 ctx.strokeStyle="#854a24";

 ctx.beginPath();
 ctx.arc(350,350,100,0,Math.PI*2);
 ctx.stroke();

 ctx.beginPath();
 ctx.arc(350,350,65,0,Math.PI*2);
 ctx.stroke();

 ctx.beginPath();
 ctx.arc(350,350,9,0,Math.PI*2);
 ctx.fillStyle="#a32828";
 ctx.fill();

 // Shooting lines
 ctx.lineWidth=3;
 ctx.strokeStyle="#884d26";

 ctx.beginPath();
 ctx.moveTo(145,555);
 ctx.lineTo(555,555);
 ctx.moveTo(145,145);
 ctx.lineTo(555,145);
 ctx.moveTo(145,145);
 ctx.lineTo(145,555);
 ctx.moveTo(555,145);
 ctx.lineTo(555,555);
 ctx.stroke();

 // Pockets
 pockets.forEach(p=>{
  ctx.fillStyle="#73431e";
  ctx.beginPath();
  ctx.arc(p[0],p[1],31,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#08090c";
  ctx.beginPath();
  ctx.arc(p[0],p[1],24,0,Math.PI*2);
  ctx.fill();
 });

 // Board decoration
 ctx.fillStyle="#6b3c20";
 ctx.font="bold 15px Arial";
 ctx.textAlign="center";
 ctx.fillText("MAYANK",350,43);
}

function drawCoin(c){
 if(!c.alive)return;

 ctx.save();
 ctx.translate(c.x,c.y);

 ctx.fillStyle="#0005";
 ctx.beginPath();
 ctx.ellipse(3,5,c.r,c.r*.8,0,0,Math.PI*2);
 ctx.fill();

 let g=ctx.createRadialGradient(
  -c.r*.4,-c.r*.5,2,0,0,c.r*1.4
 );

 if(c.type==="white"){
  g.addColorStop(0,"#fff");
  g.addColorStop(.6,"#ddd");
  g.addColorStop(1,"#777");
 }else if(c.type==="black"){
  g.addColorStop(0,"#777");
  g.addColorStop(.5,"#222");
  g.addColorStop(1,"#000");
 }else if(c.type==="queen"){
  g.addColorStop(0,"#ffaaaa");
  g.addColorStop(.5,"#d51c2c");
  g.addColorStop(1,"#690000");
 }else{
  g.addColorStop(0,"#fff3ac");
  g.addColorStop(.5,"#e9ad39");
  g.addColorStop(1,"#80500c");
 }

 ctx.fillStyle=g;
 ctx.beginPath();
 ctx.arc(0,0,c.r,0,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle="#ffffff88";
 ctx.lineWidth=2;
 ctx.stroke();

 ctx.beginPath();
 ctx.arc(0,0,c.r*.65,0,Math.PI*2);
 ctx.strokeStyle="#ffffff55";
 ctx.stroke();

 ctx.restore();
}

function drawAim(){
 if(!aiming||!aim)return;

 let s=striker();
 let dx=s.x-aim.x;
 let dy=s.y-aim.y;
 let len=Math.hypot(dx,dy);

 if(len<3)return;

 let power=Math.min(len,125);
 ctx.save();

 ctx.setLineDash([8,7]);
 ctx.strokeStyle="#b52a20";
 ctx.lineWidth=3;

 ctx.beginPath();
 ctx.moveTo(s.x,s.y);
 ctx.lineTo(
  s.x+dx/len*power*2,
  s.y+dy/len*power*2
 );
 ctx.stroke();

 ctx.setLineDash([]);
 ctx.strokeStyle="#fff";
 ctx.beginPath();
 ctx.arc(s.x,s.y,27,0,Math.PI*2);
 ctx.stroke();

 ctx.restore();
}

function draw(){
 ctx.clearRect(0,0,SIZE,SIZE);
 board();
 coins.forEach(drawCoin);
 drawAim();

 particles.forEach(p=>{
  ctx.globalAlpha=p.life;
  ctx.fillStyle=p.color;
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;
 });
}

function burst(x,y,color){
 for(let i=0;i<9;i++){
  let a=Math.random()*Math.PI*2;
  let v=Math.random()*3+1;
  particles.push({
   x,y,
   vx:Math.cos(a)*v,
   vy:Math.sin(a)*v,
   r:Math.random()*3+2,
   life:1,color
  });
 }
}

function playSound(){
 if(!sound)return;
 try{
  let ac=new AudioContext();
  let o=ac.createOscillator();
  let gain=ac.createGain();
  o.connect(gain);
  gain.connect(ac.destination);
  o.frequency.value=170;
  gain.gain.value=.035;
  o.start();
  o.stop(ac.currentTime+.045);
  o.onended=()=>ac.close();
 }catch(e){}
}

function physics(){
 let list=coins.filter(c=>c.alive);

 // Move coins
 list.forEach(c=>{
  c.x+=c.vx;
  c.y+=c.vy;

  c.vx*=.986;
  c.vy*=.986;

  if(Math.abs(c.vx)<.045)c.vx=0;
  if(Math.abs(c.vy)<.045)c.vy=0;

  if(c.x-c.r<MAX-534){
   c.x=MAX-534+c.r;
   c.vx=Math.abs(c.vx)*.8;
  }
  if(c.x+c.r>MAX){
   c.x=MAX-c.r;
   c.vx=-Math.abs(c.vx)*.8;
  }
  if(c.y-c.r<MIN+2){
   c.y=MIN+2+c.r;
   c.vy=Math.abs(c.vy)*.8;
  }
  if(c.y+c.r>MAX){
   c.y=MAX-c.r;
   c.vy=-Math.abs(c.vy)*.8;
  }

  // Pocket detection
  for(let p of pockets){
   if(Math.hypot(c.x-p[0],c.y-p[1])<29){
    c.alive=false;
    shotCoins++;
    burst(c.x,c.y,"#ffcc66");
    playSound();

    if(c.type==="striker"){
     foul=true;
     message="FOUL! Striker pocketed!";
    }else if(c.type==="queen"){
     queenPending=true;
     message="QUEEN POCKETED!";
    }else{
     if(c.type===(player===1?"white":"black")){
      score[player-1]++;
      message="Great shot! +1 Point";
     }else{
      message="Opponent's coin pocketed!";
     }
    }
    break;
   }
  }
 });

 // Collision
 list=coins.filter(c=>c.alive);

 for(let i=0;i<list.length;i++){
  for(let j=i+1;j<list.length;j++){
   let a=list[i],b=list[j];
   let dx=b.x-a.x,dy=b.y-a.y;
   let d=Math.hypot(dx,dy);
   let min=a.r+b.r;

   if(d<min&&d>0){
    let nx=dx/d,ny=dy/d;
    let overlap=min-d;

    a.x-=nx*overlap/2;
    a.y-=ny*overlap/2;
    b.x+=nx*overlap/2;
    b.y+=ny*overlap/2;

    let rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;

    if(rel<0){
     let impulse=-(1.65)*rel/(1/a.r+1/b.r);
     a.vx-=impulse/a.r*nx;
     a.vy-=impulse/a.r*ny;
     b.vx+=impulse/b.r*nx;
     b.vy+=impulse/b.r*ny;
     playSound();
    }
   }
  }
 }

 // Particles
 particles.forEach(p=>{
  p.x+=p.vx;
  p.y+=p.vy;
  p.life-=.035;
 });
 particles=particles.filter(p=>p.life>0);

 let active=coins.some(c=>c.alive&&
  (Math.abs(c.vx)>.06||Math.abs(c.vy)>.06));

 if(!active&&moving){
  moving=false;
  finishShot();
 }
}

function finishShot(){
 if(foul){
  score[player-1]=Math.max(0,score[player-1]-1);
  queenPending=false;
  foul=false;
 }else if(queenPending){
  score[player-1]+=3;
  queenPending=false;
 }

 if(score[0]>=15||score[1]>=15){
  finished=true;
  message="🏆 PLAYER "+(score[0]>=15?1:2)+" WINS!";
  updateUI();
  return;
 }

 if(shotCoins===0){
  player=player===1?2:1;
 }

 let s=striker();
 if(s){
  s.alive=true;
  s.x=350;
  s.y=player===1?555:145;
  s.vx=0;s.vy=0;
 }

 shotCoins=0;
 updateUI();
 if(!message.includes("FOUL")&&!message.includes("QUEEN")){
  message="Player "+player+" की बारी!";
 }
 document.getElementById("status").textContent=message;
}

function updateUI(){
 document.getElementById("score1").textContent=score[0];
 document.getElementById("score2").textContent=score[1];

 document.getElementById("box1").classList.toggle("active",player===1);
 document.getElementById("box2").classList.toggle("active",player===2);

 document.getElementById("status").textContent=message;
}

function position(e){
 let r=canvas.getBoundingClientRect();
 return {
  x:(e.clientX-r.left)*700/r.width,
  y:(e.clientY-r.top)*700/r.height
 };
}

canvas.addEventListener("pointerdown",e=>{
 if(moving||finished)return;

 let s=striker();
 if(!s||!s.alive)return;

 let p=position(e);
 if(Math.hypot(p.x-s.x,p.y-s.y)<48){
  aiming=true;
  aim=p;
  canvas.setPointerCapture(e.pointerId);
 }
});

canvas.addEventListener("pointermove",e=>{
 if(aiming)aim=position(e);
});

canvas.addEventListener("pointerup",()=>{
 if(!aiming)return;

 aiming=false;
 let s=striker();

 let dx=s.x-aim.x;
 let dy=s.y-aim.y;
 let len=Math.hypot(dx,dy);

 if(len>7){
  let speed=Math.min(len*.105,14);
  s.vx=dx/len*speed;
  s.vy=dy/len*speed;
  moving=true;
  shotCoins=0;
  foul=false;
  queenPending=false;
  message="Coins are moving...";
  updateUI();
 }
 aim=null;
});

function newGame(){
 score=[0,0];
 player=1;
 finished=false;
 moving=false;
 aiming=false;
 particles=[];
 shotCoins=0;
 queenPending=false;
 foul=false;
 message="Player 1 की बारी!";
 resetCoins();
 updateUI();
}

function toggleSound(){
 sound=!sound;
 document.getElementById("sound").textContent=sound?"ON":"OFF";
}

function showRules(){
 alert(
 "MAYANK CARROM RULES\n\n"+
 "Player 1 = White\n"+
 "Player 2 = Black\n"+
 "Queen = 3 Bonus Points\n"+
 "Striker pocket = -1 Point\n"+
 "First to 15 points wins!"
 );
}

function loop(){
 if(moving&&!finished)physics();
 draw();
 requestAnimationFrame(loop);
}

resetCoins();
updateUI();
loop();
</script>
</body>
</html>
